<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quantum Dhamma Mirror - MRI Edition</title>
    <style>
        body { background-color: #030504; color: #00ffcc; font-family: 'Courier New', Courier, monospace; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        h2 { font-size: 1.2rem; margin-bottom: 5px; text-shadow: 0 0 10px #00ffcc; text-align: center; }
        
        .camera-status { font-size: 0.9rem; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .led { width: 8px; height: 8px; border-radius: 50%; background-color: #ff3333; box-shadow: 0 0 5px #ff3333; transition: 0.3s; }
        .led.active { background-color: #00ffcc; box-shadow: 0 0 15px #00ffcc; animation: pulse 1s infinite; }
        .led.mri-active { background-color: #ff00ff; box-shadow: 0 0 15px #ff00ff; animation: blink 0.5s infinite; }
        
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.5); } }

        /* Viewport Culling */
        #viewport { width: 100%; max-width: 380px; height: 45vh; border: 2px dashed #00ffcc; border-radius: 12px; background: #000; overflow: hidden; position: relative; box-shadow: inset 0 0 20px rgba(0,255,204,0.2); margin-bottom: 15px; display: flex; align-items: center; justify-content: center; }
        
        video { width: 100%; height: 100%; object-fit: cover; display: none; }
        canvas { width: 100%; height: 100%; object-fit: cover; display: none; }
        #rendered-img { width: 100%; height: 100%; object-fit: cover; display: none; }
        
        /* ฟิลเตอร์ปรับแสงและ MRI กระดูก (ทะลวงอวิชชา) */
        .clear-mirror { filter: brightness(1.2) contrast(1.1); } 
        /* MRI Bone Filter: พลิกค่าแสง ดึงคอนทราสต์ให้เห็นโครงกระดูกและเส้นเลือดขาวดำ */
        .mri-bone-filter { filter: grayscale(1) invert(1) contrast(2.5) brightness(1.2) sepia(0.3) hue-rotate(180deg); }
        
        /* สแกนไลน์ (Radar Scan) สำหรับโหมด MRI */
        .scan-line { position: absolute; width: 100%; height: 5px; background: rgba(255, 0, 255, 0.5); box-shadow: 0 0 15px #ff00ff; top: 0; left: 0; display: none; animation: scan 2s linear infinite; }
        @keyframes scan { 0% { top: 0; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 100%; opacity: 0; } }

        #render-message { position: absolute; z-index: 10; font-size: 0.85rem; color: #aaa; text-align: center; }

        .controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 400px; width: 100%; }
        button { background: #0a110d; color: #00ffcc; border: 1px solid #00ffcc; padding: 12px 10px; border-radius: 8px; font-family: inherit; font-weight: bold; cursor: pointer; font-size: 0.85rem; flex: 1 1 45%; transition: 0.2s; }
        button:active { background: #00ffcc; color: #000; transform: scale(0.95); }
        
        .btn-toggle { flex: 1 1 100%; border-color: #ffff00; color: #ffff00; }
        .btn-mri { flex: 1 1 100%; border-color: #ff00ff; background: #2a002a; color: #ff99ff; font-size: 1rem;}
        .btn-mri:active { background: #ff00ff; color: #000; }
        .btn-export { flex: 1 1 100%; border-color: #00ffcc; background: #003322; color: #fff; }

        .system-log { margin-top: 15px; font-size: 0.75rem; color: #666; width: 100%; max-width: 380px; line-height: 1.4; overflow-y: auto; max-height: 80px; }
    </style>
</head>
<body>

    <h2>👁️ Quantum Dhamma Mirror</h2>
    <div class="camera-status">
        <div id="led-indicator" class="led"></div>
        <span id="status-text">โหมดสุญญตา (Zero-Payload)</span>
    </div>

    <!-- กระจก Viewport -->
    <div id="viewport">
        <div id="render-message">[ สแตนด์บาย รอการสัมผัส ]</div>
        <video id="camera-stream" autoplay playsinline></video>
        <canvas id="live-canvas"></canvas>
        <img id="rendered-img" src="" alt="Soul Pointer">
        <div id="mri-scanline" class="scan-line"></div>
    </div>

    <div class="controls">
        <button class="btn-toggle" onclick="toggleCamera()">🔄 0. เปิดกระจก / สลับกล้อง</button>
        <button class="btn-mri" onclick="startRealtimeMRI()">💀 1. Real-time MRI (อัฏฐิกสัญญา)</button>
        <button onclick="snapQuantumPhoto()" style="border-color:#ff5555; color:#ff5555;">📸 2. Snap วิญญาณพอยเตอร์</button>
        <button onclick="renderViewport('EXTERNAL')">✨ 3. เรนเดอร์รูปสมบัติ</button>
        <button class="btn-export" onclick="exportSoulPointer()">💾 4. จุติวิญญาณลงเครื่อง (Export)</button>
    </div>

    <!-- Canvas แฝงสำหรับเซฟภาพ -->
    <canvas id="hidden-canvas" style="display:none;"></canvas>

    <div class="system-log" id="sys-log">
        > System: สแตนด์บาย (Idle)<br>
    </div>

    <script>
        const video = document.getElementById('camera-stream');
        const liveCanvas = document.getElementById('live-canvas');
        const liveCtx = liveCanvas.getContext('2d');
        const hiddenCanvas = document.getElementById('hidden-canvas');
        const hiddenCtx = hiddenCanvas.getContext('2d');
        const renderedImg = document.getElementById('rendered-img');
        const msg = document.getElementById('render-message');
        const log = document.getElementById('sys-log');
        const scanLine = document.getElementById('mri-scanline');
        
        let activeSoulPointer_Base64 = null;
        let stream = null;
        let currentFacingMode = "user"; // เริ่มที่กล้องหน้าให้ส่องตัวเองก่อน
        let mriInterval = null;

        // --- 0. เปิดกระจกปกติ ---
        async function toggleCamera() {
            stopMRI();
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                currentFacingMode = currentFacingMode === "user" ? "environment" : "user";
            }
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode }, audio: false });
                video.srcObject = stream;
                video.style.transform = currentFacingMode === "user" ? "scaleX(-1)" : "scaleX(1)";
                
                video.style.display = "block";
                liveCanvas.style.display = "none";
                renderedImg.style.display = "none";
                msg.style.display = "none";
                scanLine.style.display = "none";
                
                document.getElementById('led-indicator').className = 'led active';
                document.getElementById('status-text').innerText = 'สตรีมสด (รูปกายภายนอก)';
                log.innerHTML = `> System: เปิดกล้อง ${currentFacingMode === "user" ? "หน้า" : "หลัง"} สำเร็จ`;
            } catch (err) {
                log.innerHTML = `> Error: ไม่สามารถเปิดกล้องได้`;
            }
        }

        // --- 1. Real-time MRI (สุดยอดกรรมฐาน + เมตตาระบบ) ---
        async function startRealtimeMRI() {
            if (!stream) await toggleCamera(); // ถ้ายังไม่เปิดกล้อง ให้เปิดก่อน
            if (!stream) return;

            // ซ่อนวิดีโอสด โชว์ Canvas แทน
            video.style.display = "none";
            renderedImg.style.display = "none";
            msg.style.display = "none";
            liveCanvas.style.display = "block";
            scanLine.style.display = "block"; // เปิดเลเซอร์สแกน
            
            liveCanvas.width = video.videoWidth || 480;
            liveCanvas.height = video.videoHeight || 640;
            liveCanvas.className = "mri-bone-filter"; // ใส่ฟิลเตอร์ MRI ทะลวงกระดูก
            
            document.getElementById('led-indicator').className = 'led mri-active';
            document.getElementById('status-text').innerText = 'สแกน MRI กระดูก (อัฏฐิกสัญญา)';
            log.innerHTML = `> System: Real-time MRI Active<br>> Culling: Low-FPS เพื่อลดภาระ CPU (Hardware Compassion)`;

            // ลูปดึงภาพแบบ Low-FPS (ประมาณ 4 เฟรมต่อวินาที) เพื่อเมตตาต่อ iPhone 17
            if (mriInterval) clearInterval(mriInterval);
            mriInterval = setInterval(() => {
                if(video.videoWidth > 0) {
                    if (currentFacingMode === "user") {
                        liveCtx.save();
                        liveCtx.translate(liveCanvas.width, 0);
                        liveCtx.scale(-1, 1);
                        liveCtx.drawImage(video, 0, 0, liveCanvas.width, liveCanvas.height);
                        liveCtx.restore();
                    } else {
                        liveCtx.drawImage(video, 0, 0, liveCanvas.width, liveCanvas.height);
                    }
                }
            }, 250); // ดึงภาพทุก 250ms = 4 FPS (เกิด-ดับ ทีละขณะ)
        }

        function stopMRI() {
            if (mriInterval) {
                clearInterval(mriInterval);
                mriInterval = null;
            }
            scanLine.style.display = "none";
        }

        // --- 2. Snap เก็บวิญญาณพอยเตอร์ (หยุดเวลา) ---
        function snapQuantumPhoto() {
            if (!stream) return alert("กรุณาเปิดกล้อง หรือ MRI ก่อนครับ!");
            
            stopMRI();
            hiddenCanvas.width = video.videoWidth || 480;
            hiddenCanvas.height = video.videoHeight || 640;
            
            // ดึงภาพสว่างใสปิ๊งทะลวงอวิชชา
            hiddenCtx.filter = "brightness(1.4) contrast(1.2)";
            if (currentFacingMode === "user") {
                hiddenCtx.translate(hiddenCanvas.width, 0);
                hiddenCtx.scale(-1, 1);
            }
            hiddenCtx.drawImage(video, 0, 0, hiddenCanvas.width, hiddenCanvas.height);
            activeSoulPointer_Base64 = hiddenCanvas.toDataURL('image/jpeg', 0.8); 
            
            // ปิดกล้อง เมตตาระบบ 100%
            stream.getTracks().forEach(track => track.stop());
            stream = null;
            video.style.display = "none";
            liveCanvas.style.display = "none";
            
            msg.innerHTML = `<div style="color:#ff5555; animation: pulse 1s;">[ 💾 บันทึกวิญญาณพอยเตอร์สำเร็จ! ]<br>หยุดกระแสแห่งรูปนาม (นิโรธ)</div>`;
            msg.style.display = "block";
            
            document.getElementById('led-indicator').className = 'led';
            document.getElementById('led-indicator').style.animation = 'blink 0.5s infinite';
            document.getElementById('status-text').innerText = 'ระบบเข้าสู่สุญญตา (Zero-Payload)';
            log.innerHTML = `> System: ดึง Base64 สำเร็จ<br>> ดับผัสสะทั้งหมด คืนทรัพยากร CPU 100%`;
        }

        // --- 3. เรนเดอร์รูปสมบัติ (โชว์พอยเตอร์) ---
        function renderViewport(layer) {
            if (!activeSoulPointer_Base64) return alert("ต้อง Snap วิญญาณพอยเตอร์ก่อนครับ!");
            
            renderedImg.src = activeSoulPointer_Base64;
            renderedImg.style.display = "block";
            msg.style.display = "none";
            renderedImg.className = "clear-mirror";
            
            document.getElementById('status-text').innerText = 'เรนเดอร์รูปกายภายนอก';
            log.innerHTML = '> Render: รูปกายปรากฏจาก Base64 (Just-in-Time)';
        }

        // --- 4. จุติวิญญาณลงเครื่อง (Export) ---
        function exportSoulPointer() {
            if (!activeSoulPointer_Base64) return alert("ยังไม่มีไฟล์วิญญาณให้จุติครับ!");
            const link = document.createElement('a');
            link.href = activeSoulPointer_Base64;
            const timestamp = new Date().toISOString().replace(/[-:.]/g, "");
            link.download = `Quantum_Soul_Pointer_${timestamp}.jpg`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            document.getElementById('status-text').innerText = 'จุติไฟล์ลงเครื่องสำเร็จ';
            log.innerHTML = `> Export: สร้างภพภูมิใหม่สำเร็จ<br>> ไฟล์: Quantum_Soul_Pointer_${timestamp}.jpg`;
        }
    </script>
</body>
</html>
