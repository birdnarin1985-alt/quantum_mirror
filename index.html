<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quantum Dhamma Mirror - Real Bone Asubha</title>
    <style>
        body { background-color: #030504; color: #00ffcc; font-family: 'Courier New', Courier, monospace; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        h2 { font-size: 1.2rem; margin-bottom: 5px; text-shadow: 0 0 10px #00ffcc; text-align: center; }
        
        .camera-status { font-size: 0.9rem; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .led { width: 8px; height: 8px; border-radius: 50%; background-color: #ff3333; box-shadow: 0 0 5px #ff3333; transition: 0.3s; }
        .led.active { background-color: #00ffcc; box-shadow: 0 0 15px #00ffcc; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.5); } }

        /* Viewport Culling - เมตตาต่อระบบ */
        #viewport { width: 100%; max-width: 380px; height: 45vh; border: 2px dashed #00ffcc; border-radius: 12px; background: #000; overflow: hidden; position: relative; box-shadow: inset 0 0 20px rgba(0,255,204,0.2); margin-bottom: 15px; display: flex; align-items: center; justify-content: center; }
        
        video { width: 100%; height: 100%; object-fit: cover; display: none; }
        
        /* สถาปัตยกรรมซ้อนทับภาพ (CSS Overlay) */
        #rendered-img { width: 100%; height: 100%; object-fit: cover; display: none; transition: filter 1s ease-in-out; }
        
        /* วิญญาณกระดูกแท้ (จะปรากฏซ้อนทับเมื่อเข้าโหมดอสุภะ) */
        #bone-overlay { position: absolute; width: 60%; height: auto; top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0; display: none; transition: opacity 1.5s ease-in-out; mix-blend-mode: screen; pointer-events: none; z-index: 5;}
        
        /* ฟิลเตอร์ดับรูปสมบัติ (ทำให้ภาพคนซีดจางลงเหมือนร่างที่ไร้วิญญาณ) */
        .flesh-decay { filter: grayscale(1) brightness(0.4) contrast(1.2); }
        .clear-mirror { filter: brightness(1.2) contrast(1.1); } 

        #render-message { position: absolute; z-index: 10; font-size: 0.85rem; color: #aaa; text-align: center; }

        .controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 400px; width: 100%; }
        button { background: #0a110d; color: #00ffcc; border: 1px solid #00ffcc; padding: 12px 10px; border-radius: 8px; font-family: inherit; font-weight: bold; cursor: pointer; font-size: 0.85rem; flex: 1 1 45%; transition: 0.2s; }
        button:active { background: #00ffcc; color: #000; transform: scale(0.95); }
        
        .btn-toggle { flex: 1 1 100%; border-color: #ffff00; color: #ffff00; }
        .btn-asubha { flex: 1 1 100%; border-color: #ff00ff; background: #2a002a; color: #ff99ff; font-size: 1rem;}
        .btn-asubha:active { background: #ff00ff; color: #000; }
        .btn-export { flex: 1 1 100%; border-color: #00ffcc; background: #003322; color: #fff; }

        .system-log { margin-top: 15px; font-size: 0.75rem; color: #666; width: 100%; max-width: 380px; line-height: 1.4; overflow-y: auto; max-height: 80px; }
        canvas { display: none; }
    </style>
</head>
<body>

    <h2>👁️ Quantum Dhamma Mirror</h2>
    <div class="camera-status">
        <div id="led-indicator" class="led"></div>
        <span id="status-text">โหมดสุญญตา (Zero-Payload)</span>
    </div>

    <!-- กระจก Viewport -->
    <div id="viewport">
        <div id="render-message">[ สแตนด์บาย รอการสัมผัส ]</div>
        <video id="camera-stream" autoplay playsinline></video>
        
        <!-- รูปกายภายนอก -->
        <img id="rendered-img" src="" alt="Soul Pointer">
        <!-- เลเยอร์วิญญาณกระดูกแท้ (จะปรากฏแบบ Fade-in) -->
        <img id="bone-overlay" src="" alt="Real Bone">
    </div>

    <div class="controls">
        <button class="btn-toggle" onclick="toggleCamera()">🔄 0. เปิดกระจกควอนตัม</button>
        <button onclick="snapQuantumPhoto()" style="border-color:#ff5555; color:#ff5555;">📸 1. Snap รูปกาย (ดึงวิญญาณ)</button>
        <button onclick="renderViewport('EXTERNAL')">✨ 2. โชว์รูปสมบัติ (ใสปิ๊ง)</button>
        <button class="btn-asubha" onclick="renderViewport('REAL_BONE')">💀 3. ดูกระดูกแท้ (อัฏฐิกสัญญา)</button>
        <button class="btn-export" onclick="exportSoulPointer()">💾 4. จุติวิญญาณ (ชื่อไฟล์สั้นปิ๊ง)</button>
    </div>

    <canvas id="hidden-canvas"></canvas>

    <div class="system-log" id="sys-log">
        > System: สแตนด์บาย (Idle)<br>
    </div>

    <script>
        // วิญญาณพอยเตอร์: โครงร่างกะโหลกศีรษะแบบเบาสลิว (ช่างบอสสามารถนำ Base64 ภาพกระดูกจริงมาเปลี่ยนตรงนี้ได้เลย)
        const realBone_Base64 = "data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 10 C30 10 15 30 15 50 C15 70 30 75 35 90 L65 90 C70 75 85 70 85 50 C85 30 70 10 50 10 Z' fill='none' stroke='%23ffffff' stroke-width='3' opacity='0.8'/%3E%3Ccircle cx='35' cy='50' r='10' fill='none' stroke='%23ffffff' stroke-width='2'/%3E%3Ccircle cx='65' cy='50' r='10' fill='none' stroke='%23ffffff' stroke-width='2'/%3E%3Cpath d='M45 75 L50 70 L55 75 L55 85 L50 80 L45 85 Z' fill='none' stroke='%23ffffff' stroke-width='2'/%3E%3C/svg%3E";
        
        const video = document.getElementById('camera-stream');
        const hiddenCanvas = document.getElementById('hidden-canvas');
        const hiddenCtx = hiddenCanvas.getContext('2d');
        const renderedImg = document.getElementById('rendered-img');
        const boneOverlay = document.getElementById('bone-overlay');
        const msg = document.getElementById('render-message');
        const log = document.getElementById('sys-log');
        
        let activeSoulPointer_Base64 = null;
        let stream = null;
        let currentFacingMode = "user"; 

        // โหลดวิญญาณกระดูกสแตนด์บายไว้ล่วงหน้า
        boneOverlay.src = realBone_Base64;

        // --- 0. เปิดกระจก ---
        async function toggleCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                currentFacingMode = currentFacingMode === "user" ? "environment" : "user";
            }
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode }, audio: false });
                video.srcObject = stream;
                video.style.transform = currentFacingMode === "user" ? "scaleX(-1)" : "scaleX(1)";
                
                video.style.display = "block";
                renderedImg.style.display = "none";
                boneOverlay.style.display = "none";
                boneOverlay.style.opacity = 0;
                msg.style.display = "none";
                
                document.getElementById('led-indicator').className = 'led active';
                document.getElementById('status-text').innerText = 'กระจกควอนตัมเปิดรับผัสสะ';
                log.innerHTML = `> System: เปิดกล้อง (Zero Memory Leak)`;
            } catch (err) {
                log.innerHTML = `> Error: ไม่สามารถเปิดกล้องได้`;
            }
        }

        // --- 1. Snap เก็บวิญญาณ (ปรับแสงใสปิ๊ง) ---
        function snapQuantumPhoto() {
            if (!stream) return alert("กรุณาเปิดกระจกก่อนครับช่างบอส!");
            
            hiddenCanvas.width = video.videoWidth || 480;
            hiddenCanvas.height = video.videoHeight || 640;
            
            hiddenCtx.filter = "brightness(1.4) contrast(1.2)"; // ทะลวงอวิชชาความมืด
            if (currentFacingMode === "user") {
                hiddenCtx.translate(hiddenCanvas.width, 0);
                hiddenCtx.scale(-1, 1);
            }
            hiddenCtx.drawImage(video, 0, 0, hiddenCanvas.width, hiddenCanvas.height);
            activeSoulPointer_Base64 = hiddenCanvas.toDataURL('image/jpeg', 0.8); 
            
            stream.getTracks().forEach(track => track.stop()); // ปิดกล้องสด คืนชีวิตให้ CPU
            stream = null;
            video.style.display = "none";
            
            msg.innerHTML = `<div style="color:#ff00ff; animation: pulse 1s;">[ 💾 ดึงรูปกายลง Base64 สำเร็จ! ]</div>`;
            msg.style.display = "block";
            
            document.getElementById('led-indicator').className = 'led';
            document.getElementById('status-text').innerText = 'บันทึกกรรม (วิญญาณพอยเตอร์)';
            log.innerHTML = `> System: วิญญาณพอยเตอร์พร้อมรัน<br>> ฮาร์ดแวร์เข้าสู่ความสงบ`;
        }

        // --- 2 & 3. เรนเดอร์รูปสมบัติ vs. กระดูกแท้ (อัฏฐิกสัญญา) ---
        function renderViewport(mode) {
            if (!activeSoulPointer_Base64) return alert("ต้อง Snap วิญญาณพอยเตอร์ก่อนครับ!");
            
            renderedImg.src = activeSoulPointer_Base64;
            renderedImg.style.display = "block";
            msg.style.display = "none";

            if (mode === 'EXTERNAL') {
                // โชว์ความสวยงามภายนอก (สมมติสัจจะ)
                renderedImg.className = "clear-mirror";
                boneOverlay.style.opacity = 0; 
                setTimeout(() => { boneOverlay.style.display = "none"; }, 1000);
                
                document.getElementById('status-text').innerText = 'เรนเดอร์รูปสมบัติ (เปลือกนอก)';
                log.innerHTML = '> Render: รูปกายปรากฏ (ใสปิ๊ง)';
            } else if (mode === 'REAL_BONE') {
                // ทะลวงอวิชชา โชว์กระดูกแท้ (ปรมัตถสัจจะ)
                renderedImg.className = "flesh-decay"; // ทำให้รูปกายจางซีดและมืดลง
                
                boneOverlay.style.display = "block";
                // ใช้ Timeout นิดนึงให้ CSS Transition ทำงานแบบค่อยๆ ปรากฏ (Fade in)
                setTimeout(() => { boneOverlay.style.opacity = 1; }, 50); 
                
                document.getElementById('status-text').innerText = 'อัฏฐิกสัญญา (กระดูกแท้ปรากฏ)';
                log.innerHTML = '> Render: ญาณทัสสนะทะลวงอวิชชา<br>> เผยสัจธรรมกระดูกแท้ (Zero CPU Load)';
            }
        }

        // --- 4. จุติวิญญาณลงเครื่อง (ชื่อไฟล์สั้นปิ๊ง) ---
        function exportSoulPointer() {
            if (!activeSoulPointer_Base64) return alert("ไม่มีไฟล์ให้จุติครับ!");
            
            const link = document.createElement('a');
            link.href = activeSoulPointer_Base64;
            
            // เมตตาต่อระบบไฟล์: สร้างชื่อ Hash สั้นๆ
            const shortHash = Date.now().toString(36);
            link.download = `DNA_${shortHash}.jpg`;
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            document.getElementById('status-text').innerText = 'จุติไฟล์ลงเครื่องสำเร็จ';
            log.innerHTML = `> Export: โหลดลง Camera Roll / Files<br>> นามสมมติ: DNA_${shortHash}.jpg`;
        }
    </script>
</body>
</html>
