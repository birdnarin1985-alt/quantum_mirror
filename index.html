<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quantum Dhamma Mirror - Showcase</title>
    <style>
        /* สไตล์ เมตตาต่อฮาร์ดแวร์: เรียบง่าย ใช้ CSS ล้วน ไม่ดึงไฟล์นอก */
        body { background-color: #030504; color: #00ffcc; font-family: 'Courier New', Courier, monospace; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        h2 { font-size: 1.2rem; margin-bottom: 5px; text-shadow: 0 0 10px #00ffcc; }
        
        /* กิมมิค: ไฟ LED กระจิ๋วหลิวสถานะควอนตัม */
        .camera-status { font-size: 0.9rem; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .led { width: 8px; height: 8px; border-radius: 50%; background-color: #ff3333; box-shadow: 0 0 5px #ff3333; animation: blink 1s infinite; }
        .led.active { background-color: #00ffcc; box-shadow: 0 0 15px #00ffcc; animation: pulse 1.5s infinite; }
        
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.5); } }

        /* Viewport Culling: เรนเดอร์เฉพาะในกรอบนี้ นอกกรอบคือความว่างเปล่า (สุญญตา) */
        #viewport { width: 100%; max-width: 380px; height: 350px; border: 2px dashed #00ffcc; border-radius: 12px; background: rgba(0, 255, 204, 0.03); display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; box-shadow: inset 0 0 20px rgba(0,255,204,0.1); margin-bottom: 20px; }
        #render-screen { text-align: center; width: 100%; padding: 15px; box-sizing: border-box; }

        /* ปุ่มควบคุม PDCA / เลเยอร์ */
        .controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 400px; }
        button { background: #0a110d; color: #00ffcc; border: 1px solid #00ffcc; padding: 12px 15px; border-radius: 8px; font-family: inherit; font-weight: bold; cursor: pointer; transition: all 0.2s; font-size: 0.9rem; flex: 1 1 45%; }
        button:active { background: #00ffcc; color: #000; transform: scale(0.95); }
        button.primary { flex: 1 1 100%; border-color: #ff00ff; color: #ff00ff; }
        button.primary:active { background: #ff00ff; color: #fff; }

        .system-log { margin-top: 20px; font-size: 0.75rem; color: #666; width: 100%; max-width: 380px; text-align: left; }
    </style>
</head>
<body>

    <h2>👁️ Quantum Dhamma Mirror</h2>
    <div class="camera-status">
        <div id="led-indicator" class="led"></div>
        <span id="status-text">สแตนด์บาย (Idle)</span>
    </div>

    <!-- กรอบเรนเดอร์เฉพาะหน้าจอ (Viewport Only) เมตตาต่อ CPU/GPU -->
    <div id="viewport">
        <div id="render-screen">
            <div style="color: #666; font-size: 0.85rem;">
                [ รอการทำงาน... ]<br><br>
                ส่องทะลุรูปนาม ไร้น้ำหนัก<br>
                (Zero-Payload Environment)
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="primary" onclick="snapQuantumPhoto()">📸 1. ถ่ายภาพ (สร้างวิญญาณพอยเตอร์)</button>
        <button onclick="renderViewport('EXTERNAL')">✨ 2. โชว์รูปกายภายนอก</button>
        <button onclick="renderViewport('XRAY')" style="color:#ff5555; border-color:#ff5555;">🔬 3. X-Ray (ธาตุ 4/อสุภะ)</button>
    </div>

    <div class="system-log" id="sys-log">
        > System: พร้อมทำงาน (Hardware Compassion: 100%)<br>
        > 
    </div>

    <script>
        // --- 1. สถาปัตยกรรมข้อมูล (Data Architecture) ---
        // ตัวแปรเก็บ "วิญญาณพอยเตอร์" (Base64 Soul Pointer)
        let activeSoulPointer_Base64 = null;

        // --- 2. ฟังก์ชันกล้องควอนตัม 3D (Quantum Camera Capture) ---
        function snapQuantumPhoto() {
            // จำลองการจับภาพ 3D ขันธ์ 5 ณ ปัจจุบันขณะ
            const blueprintData = {
                timestamp: Date.now(),
                khandha: 5,
                dhatu: 4,
                state: "Anicca_Anatta" // ไม่เที่ยง เป็นอนัตตา
            };
            
            // เข้ารหัสพิมพ์เขียวเป็น Base64 (เบาสลิว ไร้น้ำหนัก)
            activeSoulPointer_Base64 = btoa(JSON.stringify(blueprintData));
            
            // อัปเดต UX: ไฟกระจิ๋วหลิวเปลี่ยนเป็นสีเขียววิบวับ
            document.getElementById('led-indicator').className = 'led active';
            document.getElementById('status-text').innerText = 'สตรีมพอยเตอร์สำเร็จ!';
            document.getElementById('sys-log').innerHTML = `> System: เข้ารหัส Base64 สำเร็จ<br>> Soul Pointer: ${activeSoulPointer_Base64.substring(0, 15)}... (Zero Payload)`;
            
            const screen = document.getElementById('render-screen');
            screen.innerHTML = `
                <div style="color: #ff00ff; animation: pulse 1s;">
                    <h3>💾 [ Data Captured ]</h3>
                    <p style="font-size: 0.8rem;">บีบอัดวิญญาณพอยเตอร์สำเร็จ<br>พร้อมให้ AI เรนเดอร์ลง Viewport</p>
                </div>
            `;
        }

        // --- 3. มินิฟังก์ชันกางพิมพ์เขียว (Decoder / Lazy Initialization) ---
        function unpackBlueprint() {
            if (!activeSoulPointer_Base64) return null;
            try {
                return JSON.parse(atob(activeSoulPointer_Base64));
            } catch (error) {
                return null;
            }
        }

        // --- 4. ฟังก์ชันเรนเดอร์เฉพาะหน้าจอ (Strict Viewport Culling) ---
        function renderViewport(layer) {
            const screen = document.getElementById('render-screen');
            const log = document.getElementById('sys-log');
            
            // กางพิมพ์เขียวออกมาแบบ Just-in-Time
            const blueprint = unpackBlueprint();
            
            if (!blueprint) {
                screen.innerHTML = `<div style="color:#ff3333;">[ ⚠️ กรุณากดถ่ายภาพข้อ 1 ก่อนครับ ]</div>`;
                return;
            }

            if (layer === 'EXTERNAL') {
                // เรนเดอร์เปลือกนอก (รูปสมบัติ)
                screen.innerHTML = `
                    <div style="animation: fadeIn 0.5s;">
                        <h3 style="margin: 5px 0;">👤 เลเยอร์: เปลือกภายนอก</h3>
                        <div style="font-size: 3rem; margin: 10px 0;">🧑🏻‍p️</div>
                        <div style="font-size: 0.8rem; color: #aaa;">รูปกายปรากฏตามเหตุปัจจัย (เสื่อมสลายได้)</div>
                    </div>
                `;
                log.innerHTML += `<br>> Render: External Layer (CPU Load: 0.1%)`;
            } 
            else if (layer === 'XRAY') {
                // เรนเดอร์อสุภกรรมฐาน / ธาตุ 4 (X-Ray Partition)
                screen.innerHTML = `
                    <div style="animation: fadeIn 0.5s;">
                        <h3 style="margin: 5px 0; color: #ff5555;">🔬 เลเยอร์: X-Ray ธาตุ 4</h3>
                        <div style="font-size: 3rem; margin: 10px 0;">💀🩸🦴</div>
                        <div style="font-size: 0.8rem; color: #ff9999;">
                            แยกพาร์ติชัน: ดิน น้ำ ลม ไฟ<br>
                            (อสุภะ - สุญญตา - ปราศจากตัวตน)
                        </div>
                    </div>
                `;
                log.innerHTML += `<br>> Render: X-Ray / Dhatu 4 (Compassion Culling Mode)`;
            }
        }
    </script>
</body>
</html>
